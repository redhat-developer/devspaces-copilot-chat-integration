name: Build & Release Copilot Chat integration for VS Code in Dev Spaces

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "branch/tag to build (eg. 'release/0.36')"
        type: string
        default: main
      publishToOVSX:
        description: "Publish to OpenVSX Registry ?"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "false"
jobs:
  packaging-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          repository: redhat-developer/devspaces-copilot-chat-integration
          path: devspaces-copilot-chat-integration
          fetch-depth: 0
          fetch-tags: true
      - name: Set Up NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install NodeJS dependencies
        run: npm install -g typescript "@vscode/vsce" "ovsx"
      - name: Build and package extension
        run: |
          pushd devspaces-copilot-chat-integration
          if [ ${{ inputs.revision }} != 'main' ]; then
            git config --global user.email "devspaces-copilot-chat-integration-bot@users.noreply.github.com"
            git config --global user.name "devspaces-copilot-chat-integration-bot"
            git checkout ${{ inputs.revision }}
            git cherry-pick main
          fi
          mv package.json tmpfile.json
          jq 'del(.extensionPack)' tmpfile.json > package.json
          rm tmpfile.json

          EXT_VERSION=$(cat package.json | jq -r .version)
          echo "EXT_VERSION=${EXT_VERSION}" >> $GITHUB_ENV
          npm install
          NODE_OPTIONS="--experimental-strip-types" npm run build
          vsce package -o ../devspaces-copilot-chat-integration-${EXT_VERSION}-${GITHUB_RUN_NUMBER}.vsix
      - name: Upload VSIX Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: devspaces-copilot-chat-integration
          path: |
            devspaces-copilot-chat-integration-${{ env.EXT_VERSION }}-${{github.run_number}}.vsix
          if-no-files-found: error
  release-job:
    environment: ${{ inputs.publishToOVSX == 'true' && 'release' || 'non-release' }}
    runs-on: ubuntu-latest
    needs: packaging-job
    steps:
      - name: Set Up NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm install -g typescript "@vscode/vsce" "ovsx"
      - name: Download VSIX
        uses: actions/download-artifact@v5
      - name: Publish to OpenVSX Registry
        if: ${{ inputs.publishToOVSX == 'true' }}
        run: |
          ovsx publish -p ${{ secrets.OVSX_MARKETPLACE_TOKEN }}  --packagePath devspaces-copilot-chat-integration-*-${GITHUB_RUN_NUMBER}.vsix
